version: "3"

# Every task below runs identically on Windows, macOS and Linux: go-task uses
# its own POSIX-compatible shell interpreter rather than the host shell.
dotenv: [".env"]

vars:
  SERVER_PKG: ./cmd/server

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run the server (starts the database, applies embedded migrations)
    deps: [db:up]
    cmds:
      - go run {{.SERVER_PKG}}

  build-linux:
    desc: Cross-compile the server for linux/amd64 into dist/ghostman-server
    vars:
      # Falls back to "unknown" outside a git checkout. 2>/dev/null works on
      # Windows too: go-task's shell interpreter maps it to NUL.
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo unknown
      # A template, not `date -u`: there is no date binary on Windows.
      BUILD_TIME: '{{dateInZone "2006-01-02T15:04:05Z07:00" now "UTC"}}'
    # Set per task through env:, so the cross-compile settings never leak into
    # other tasks and no shell-specific VAR=val syntax is needed.
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      # -s -w strips the symbol table and DWARF data for a smaller binary;
      # -trimpath keeps build-machine paths out of it.
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}} -X main.buildTime={{.BUILD_TIME}}" -o dist/ghostman-server {{.SERVER_PKG}}
      - echo "built dist/ghostman-server ({{.VERSION}}, {{.BUILD_TIME}})"

  db:up:
    desc: Start PostgreSQL and wait until it is healthy
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop PostgreSQL (data is preserved)
    cmds:
      - docker compose down

  db:reset:
    desc: Destroy the database volume and start a fresh PostgreSQL
    cmds:
      - docker compose down -v
      - task: db:up

  db:psql:
    desc: Open a psql shell inside the database container
    cmds:
      - docker compose exec postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"

  migrate:up:
    desc: Apply all pending migrations
    deps: [db:up]
    cmds:
      - go run {{.SERVER_PKG}} -migrate=up

  migrate:down:
    desc: Roll back the most recent migration
    deps: [db:up]
    cmds:
      - go run {{.SERVER_PKG}} -migrate=down

  migrate:status:
    desc: Show which migrations have been applied
    deps: [db:up]
    cmds:
      - go run {{.SERVER_PKG}} -migrate=status

  migrate:create:
    desc: 'Create a new migration: task migrate:create -- add_workspaces'
    cmds:
      - cmd: '{{if eq .CLI_ARGS ""}}echo "usage: task migrate:create -- <name>" && exit 1{{else}}go run {{.SERVER_PKG}} -migrate=create -name {{.CLI_ARGS}}{{end}}'

  sqlc:
    desc: Regenerate sqlc code from internal/db/queries
    cmds:
      - sqlc generate

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 ./...

  tidy:
    desc: Tidy and verify module dependencies
    cmds:
      - go mod tidy
      - go mod verify
