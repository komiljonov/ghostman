version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the goose migration files directly, so the schema it generates
    # against is always the schema the server actually runs.
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        # sqlc singularises table names when naming structs, turning app_meta
        # into AppMetum. Renames are keyed by that singularised name.
        rename:
          app_metum: "AppMeta"
        # Every uuid/timestamptz column in this schema is NOT NULL, so the
        # generated code can use plain Go types instead of the pgtype wrappers.
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
            nullable: false
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false
