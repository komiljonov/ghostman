# Local development dependencies only. The Go server runs on the host so it can
# be debugged with delve directly from VS Code.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostman}
      POSTGRES_DB: ${POSTGRES_DB:-ghostman}
      # Speeds up initdb and keeps collation behaviour identical on Windows,
      # macOS and Linux hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostman} -d ${POSTGRES_DB:-ghostman}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: ghostman_postgres_data
